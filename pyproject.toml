[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xwx-tools"
dynamic = ["version"]
description = "Caixa de ferramentas de linha de comando: gcpuse (troca de contexto GCP) e outros utilitarios."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "welmends", email = "wellmend0@gmail.com" }]
keywords = ["gcloud", "gcp", "cli", "adc", "terraform", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/welmends/xwx-tools"
Repository = "https://github.com/welmends/xwx-tools"
Issues = "https://github.com/welmends/xwx-tools/issues"
Changelog = "https://github.com/welmends/xwx-tools/blob/main/CHANGELOG.md"

# Cada script novo vira uma linha aqui (nome-do-comando = "xwx.cli.modulo:main").
[project.scripts]
gcpuse = "xwx.cli.gcpuse:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.hatch.version]
path = "src/xwx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xwx"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
